name: Build APK
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: false
      - name: Cache Robolectric runtime artifacts
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-robolectric-${{ hashFiles('**/build.gradle.kts', '**/settings.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-robolectric-
      - name: Restore shared debug keystore
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_B64" ]; then
            echo "$DEBUG_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/musecal-debug.keystore"
            echo "MUSECAL_DEBUG_KEYSTORE=$RUNNER_TEMP/musecal-debug.keystore" >> "$GITHUB_ENV"
          fi
      - name: Assemble debug APK
        run: ./gradlew assembleDebug testDebugUnitTest lintDebug --console=plain
      - id: vars
        if: always()
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: musecal-debug-apk-${{ steps.vars.outputs.short }}
          path: app/build/outputs/apk/debug/app-debug.apk
      # EM-1: スクショテストの出力（_actual / _compare 等）を失敗時にも残す
      - name: Upload screenshot test outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roborazzi-outputs-${{ steps.vars.outputs.short }}
          path: app/build/outputs/roborazzi/
          if-no-files-found: ignore
