# EM-2: CI エミュレータジョブ（changes/2026-11-21-emulator-verification/tasks.md の EM-2）。
# 手動実行（workflow_dispatch）だけで動く。GitHub ホストの Ubuntu ランナーで KVM を有効にして
# Android エミュレータを起動し、デバッグ APK とテスト APK を入れて操作シナリオを実行する。
# 各ステップのスクリーンショット（PNG）と画面構造（UI Automator dump の XML・Compose セマンティクス）を
# 成果物 emulator-evidence-<sha> に上げる。サインインはしない（未ログイン状態の確認まで）。
# Secrets は使わない（デバッグ署名は自動生成のまま。エミュレータに入れるだけなので共通鍵は不要）。
name: Emulator scenario
on:
  workflow_dispatch:
    inputs:
      api-level:
        description: エミュレータの API レベル
        default: '34'
        required: false
# 読み取りだけを明示する（実行ログの実効権限も Contents/Metadata/Packages の read のみ。拡大ではない）
permissions:
  contents: read
jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      API_LEVEL: ${{ inputs.api-level || '34' }}
      EVIDENCE: ${{ github.workspace }}/evidence
    steps:
      # アクションはタグでなくコミット SHA で固定する（タグの付け替えで中身が変わらないように）
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - name: Build debug APK and test APK
        run: ./gradlew assembleDebug assembleDebugAndroidTest --console=plain
      - id: vars
        run: |
          echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          mkdir -p "$EVIDENCE"
          date -u +%s > "$RUNNER_TEMP/t_start"
      # エミュレータの起動からシナリオ実行・証拠の取り出しまで（.github/scripts/em2_scenario.sh が本体）
      - name: Run scenario on emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ env.API_LEVEL }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/em2_scenario.sh "$EVIDENCE"
      - name: Timing
        if: always()
        run: |
          start=$(cat "$RUNNER_TEMP/t_start" 2>/dev/null || echo 0)
          echo "emulator+scenario seconds: $(( $(date -u +%s) - start ))" | tee -a "$EVIDENCE/timing.txt"
          echo "files:"; (cd "$EVIDENCE" && find . -type f | sort) || true
      # 証拠の欠けは em2_scenario.sh が必須ファイル一覧で検査して失敗にする（evidence_check.txt）。
      # ここではフォルダが丸ごと空のときもジョブを失敗にする
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: emulator-evidence-${{ steps.vars.outputs.short }}
          path: evidence/
          if-no-files-found: error
